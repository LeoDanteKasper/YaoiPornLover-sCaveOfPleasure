<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Diente - SWF WASM Arcade Player</title>
    <!-- Motor Ruffle en WebAssembly desde CDN CDNJS/Unpkg -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <style>
        :root {
            --bg-base: #06080e;
            --bg-card: rgba(15, 20, 32, 0.8);
            --border-glow: rgba(99, 102, 241, 0.3);
            --accent-primary: #6366f1;
            --accent-secondary: #8b5cf6;
            --accent-cyan: #06b6d4;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --status-active: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(at 10% 10%, rgba(99, 102, 241, 0.18) 0px, transparent 40%),
                radial-gradient(at 90% 90%, rgba(139, 92, 246, 0.18) 0px, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .arcade-card {
            width: 100%;
            max-width: 1100px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.9);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .arcade-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 1.2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .game-title-group {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .game-title {
            font-size: 1.75rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.75rem;
            color: var(--status-active);
            background: rgba(16, 185, 129, 0.1);
            padding: 0.35rem 0.8rem;
            border-radius: 20px;
            border: 1px solid rgba(16, 185, 129, 0.25);
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--status-active);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--status-active);
        }

        .stage-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000000;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #ruffle-stage {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #ruffle-stage ruffle-player {
            width: 100% !important;
            height: 100% !important;
        }

        .loading-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 1s infinite linear;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .controls-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .actions-group {
            display: flex;
            gap: 0.75rem;
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: #ffffff;
            border: none;
            padding: 0.75rem 1.4rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: none;
        }

        .file-upload-btn {
            position: relative;
            overflow: hidden;
        }

        .file-upload-btn input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .arcade-card {
                padding: 1.25rem;
            }
            .controls-toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .actions-group {
                flex-direction: column;
            }
            .btn {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <main class="arcade-card">
        <header class="arcade-header">
            <div class="game-title-group">
                <h1 class="game-title">El Diente</h1>
            </div>
            <div class="status-badge" id="status-badge">
                <span class="status-dot"></span>
                <span id="status-text">Inicializando WASM...</span>
            </div>
        </header>

        <section class="stage-wrapper" id="stage-wrapper">
            <div id="ruffle-stage">
                <div class="loading-spinner" id="loader">
                    <div class="spinner"></div>
                    <span>Cargando binario SWF desde GitHub...</span>
                </div>
            </div>
        </section>

        <footer class="controls-toolbar">
            <div class="actions-group">
                <button class="btn btn-secondary" id="btn-reload">Reiniciar SWF</button>
                <div class="btn btn-secondary file-upload-btn">
                    <span>Cargar SWF Alternativo</span>
                    <input type="file" id="file-input" accept=".swf" />
                </div>
            </div>
            <button class="btn" id="btn-fullscreen">Pantalla Completa</button>
        </footer>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const RAW_SWF_URL = 'https://raw.githubusercontent.com/LeoDanteKasper/YaoiPornLover-sCaveOfPleasure/main/El_Diente.swf';
            
            const stage = document.getElementById('ruffle-stage');
            const stageWrapper = document.getElementById('stage-wrapper');
            const statusText = document.getElementById('status-text');
            const btnFullscreen = document.getElementById('btn-fullscreen');
            const btnReload = document.getElementById('btn-reload');
            const fileInput = document.getElementById('file-input');

            let rufflePlayerInstance = null;
            let loadedArrayBuffer = null;

            const initRuffleEngine = () => {
                const ruffle = window.RufflePlayer ? window.RufflePlayer.newest() : null;
                if (!ruffle) {
                    statusText.textContent = 'Error: Ruffle no cargó';
                    return null;
                }
                return ruffle.createPlayer();
            };

            const loadSwfFromUrl = async (url) => {
                try {
                    statusText.textContent = 'Descargando SWF...';
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    
                    const buffer = await response.arrayBuffer();
                    loadedArrayBuffer = buffer;
                    renderSwfBuffer(buffer);
                } catch (error) {
                    console.error('Error al cargar SWF remoto:', error);
                    statusText.textContent = 'Error CORS / Red';
                    stage.innerHTML = `
                        <div style="text-align: center; padding: 2rem; color: #ef4444;">
                            <p style="font-weight: 700; margin-bottom: 0.5rem;">No se pudo descargar el juego directamente.</p>
                            <p style="font-size: 0.85rem; color: var(--text-muted);">Puedes cargar el archivo .swf localmente usando el botón de abajo.</p>
                        </div>
                    `;
                }
            };

            const renderSwfBuffer = (buffer) => {
                stage.innerHTML = '';
                rufflePlayerInstance = initRuffleEngine();
                
                if (!rufflePlayerInstance) return;

                stage.appendChild(rufflePlayerInstance);
                rufflePlayerInstance.load({
                    data: new Uint8Array(buffer),
                    allowScriptAccess: true,
                    backgroundColor: '#000000',
                    wmode: 'direct'
                });

                statusText.textContent = 'Juego En Ejecución';
            };

            // Event Listeners
            btnReload.addEventListener('click', () => {
                if (loadedArrayBuffer) {
                    renderSwfBuffer(loadedArrayBuffer);
                } else {
                    loadSwfFromUrl(RAW_SWF_URL);
                }
            });

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        loadedArrayBuffer = evt.target.result;
                        renderSwfBuffer(loadedArrayBuffer);
                    };
                    reader.readAsArrayBuffer(file);
                }
            });

            btnFullscreen.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    stageWrapper.requestFullscreen().catch(err => {
                        console.error(`Error de pantalla completa: ${err.message}`);
                    });
                } else {
                    document.exitFullscreen();
                }
            });

            // Auto-arranque al montar el DOM
            loadSwfFromUrl(RAW_SWF_URL);
        });
    </script>
</body>
</html>
