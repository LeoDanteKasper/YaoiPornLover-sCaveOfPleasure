// ==================== AUDIO ENGINE ====================
class ChiptuneAudioEngine {
    constructor() {
        this.ctx = null;
        this.enabled = true;
    }

    init() {
        if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
        }
    }

    playTone(freq, type = 'square', duration = 0.08, vol = 0.08) {
        if (!this.enabled) return;
        this.init();
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    }

    playKeyPress() {
        const freqs = [380, 410, 440, 470];
        const randomFreq = freqs[Math.floor(Math.random() * freqs.length)];
        this.playTone(randomFreq, 'triangle', 0.02, 0.02);
    }

    playCmdSuccess() {
        this.playTone(523.25, 'square', 0.05, 0.04);
        setTimeout(() => this.playTone(659.25, 'square', 0.06, 0.04), 50);
    }

    playAffectionUp() {
        this.playTone(523.25, 'sine', 0.08, 0.06);
        setTimeout(() => this.playTone(659.25, 'sine', 0.08, 0.06), 70);
        setTimeout(() => this.playTone(783.99, 'sine', 0.08, 0.06), 140);
        setTimeout(() => this.playTone(1046.50, 'sine', 0.12, 0.08), 210);
    }

    playCombatHit() {
        this.playTone(150, 'sawtooth', 0.1, 0.08);
        setTimeout(() => this.playTone(80, 'sawtooth', 0.15, 0.1), 50);
    }

    playNSFW() {
        this.playTone(220, 'sine', 0.15, 0.1);
        setTimeout(() => this.playTone(261.63, 'sine', 0.2, 0.12), 100);
        setTimeout(() => this.playTone(329.63, 'sine', 0.25, 0.15), 250);
    }

    playEvent() {
        this.playTone(440, 'square', 0.1, 0.08);
        setTimeout(() => this.playTone(554.37, 'square', 0.1, 0.08), 100);
        setTimeout(() => this.playTone(659.25, 'square', 0.15, 0.1), 200);
        setTimeout(() => this.playTone(880, 'square', 0.3, 0.12), 350);
    }
}

// ==================== SIMS ENGINE ====================
class SimsEngine {
    constructor(npcsDatabase) {
        this.npcs = npcsDatabase;
        this.initProfiles();
    }

    initProfiles() {
        for (let key in this.npcs) {
            let baseProfile = simsProfileDB[key] || simsProfileDB._default;
            this.npcs[key].simsData = {
                relationship: baseProfile.relationship || 50,
                mentalState: baseProfile.mentalState || "Estable",
                outfit: baseProfile.outfit || "Ropa casual multiversal",
                likes: baseProfile.likes || ["Explorar", "Charlar"],
                dislikes: baseProfile.dislikes || ["Mala onda", "Ignorancia"],
                arousal: baseProfile.arousal || 0,
                currentMood: "normal"
            };
            this.npcs[key].affinity = this.npcs[key].simsData.relationship;
        }
    }

    updateAffection(npcKey, delta) {
        const npc = this.npcs[npcKey];
        if (!npc) return;

        let current = npc.simsData.relationship;
        current = Math.max(0, Math.min(100, current + delta));
        npc.simsData.relationship = current;

        this.updateMentalState(npcKey);
        npc.affinity = current;
    }

    updateArousal(npcKey, delta) {
        const npc = this.npcs[npcKey];
        if (!npc) return;

        npc.simsData.arousal = Math.max(0, Math.min(100, npc.simsData.arousal + delta));
        
        if (npc.simsData.arousal > 80) {
            npc.simsData.currentMood = "aroused";
        } else if (npc.simsData.arousal > 50) {
            npc.simsData.currentMood = "excited";
        }
    }

    updateMentalState(npcKey) {
        const npc = this.npcs[npcKey];
        let rel = npc.simsData.relationship;

        if (rel >= 90) npc.simsData.mentalState = "Esposo / Comprometido";
        else if (rel >= 75) npc.simsData.mentalState = "Enamorado / Devoto";
        else if (rel >= 60) npc.simsData.mentalState = "Excitado / Interesado";
        else if (rel >= 40) npc.simsData.mentalState = "Tranquilo / Amigable";
        else if (rel >= 20) npc.simsData.mentalState = "Distante / Desconfiado";
        else npc.simsData.mentalState = "Hostil / Agresivo";
    }

    setMindBreak(npcKey) {
        const npc = this.npcs[npcKey];
        npc.simsData.mentalState = "Mindbroken / Sumiso Permanente";
        npc.simsData.currentMood = "mindbroken";
        npc.simsData.arousal = 100;
    }

    setMindControl(npcKey) {
        const npc = this.npcs[npcKey];
        npc.simsData.mentalState = "Controlado Mentalmente";
        npc.simsData.currentMood = "controlled";
    }

    applyCharacterTheme(npcKey) {
        const npc = this.npcs[npcKey];
        if (!npc || !npc.tags) return;

        let chosenTag = "default";
        for (let tag of npc.tags) {
            if (themePalettes[tag]) {
                chosenTag = tag;
                break;
            }
        }

        const palette = themePalettes[chosenTag];
        const root = document.documentElement;

        root.style.setProperty('--bg-color', palette["--bg-color"]);
        root.style.setProperty('--term-bg', palette["--term-bg"]);
        root.style.setProperty('--border-color', palette["--border-color"]);
        root.style.setProperty('--purple', palette["--purple"]);
        root.style.setProperty('--gold', palette["--gold"]);
        root.style.setProperty('--text-main', palette["--text-main"]);
    }

    getMoodClass(mood) {
        const classes = {
            normal: "mood-normal",
            aroused: "mood-aroused",
            excited: "mood-aroused",
            submissive: "mood-submissive",
            dominant: "mood-dominant",
            mindbroken: "mood-mindbroken",
            controlled: "mood-mindbroken",
            irritated: "mood-irritated"
        };
        return classes[mood] || "mood-normal";
    }

    renderSimsCard(npcKey) {
        const npc = this.npcs[npcKey];
        if (!npc) return `<span class="warning">Personaje no encontrado.</span>`;

        this.applyCharacterTheme(npcKey);

        const sims = npc.simsData;
        const rel = sims.relationship;
        const arousal = sims.arousal;

        const barLength = 10;
        const filled = Math.round((rel / 100) * barLength);
        const empty = barLength - filled;
        const progressBar = "🟩".repeat(filled) + "⬛".repeat(empty);

        const arousalBar = "🔥".repeat(Math.round(arousal / 10)) + "⚫".repeat(10 - Math.round(arousal / 10));

        const moodClass = this.getMoodClass(sims.currentMood);
        const moodIndicator = `<span class="mood-indicator ${moodClass}">${sims.currentMood.toUpperCase()}</span>`;

        let currentDialogue = "";
        if (npc.dialogues && npc.dialogues[sims.currentMood]) {
            const dialogues = npc.dialogues[sims.currentMood];
            currentDialogue = dialogues[Math.floor(Math.random() * dialogues.length)];
        }

        return `
            <div style="border: 2px solid var(--border-color); padding: 12px; background: rgba(0,0,0,0.4); border-radius: 8px; margin: 10px 0;">
                <div style="font-size:1.1rem; color:var(--purple); font-weight:bold; border-bottom:1px solid var(--border-color); padding-bottom:4px;">
                    💎 FICHA SIMS: ${npc.name.toUpperCase()} ${moodIndicator}
                </div>
                
                <div style="margin-top: 8px;">
                    <strong>Barra de Agrado:</strong> [${progressBar}] <strong>${rel} / 100 pts</strong>
                </div>
                <div style="margin-top: 4px;">
                    <strong>Excitación:</strong> [${arousalBar}] <strong>${arousal} / 100</strong>
                </div>
                <div><strong>Estado Mental:</strong> <span style="color:var(--gold);">${sims.mentalState}</span></div>
                <div><strong>Ropa Actual:</strong> ${sims.outfit}</div>
                
                <div style="margin-top: 6px; font-size: 0.85rem;">
                    <span style="color:var(--green);">👍 Gustos:</span> ${sims.likes.join(", ")}<br>
                    <span style="color:var(--red);">👎 Disgustos:</span> ${sims.dislikes.join(", ")}
                </div>

                ${currentDialogue ? `
                <div class="speech-bubble" style="margin-top: 8px;">
                    <strong>💬 Dice:</strong> "${currentDialogue}"
                </div>
                ` : ''}
            </div>
        `;
    }
}

// ==================== UTILITY FUNCTIONS ====================
function printLog(content, type = '') {
    const terminalBody = document.getElementById('terminal-body');
    if (!terminalBody) return;
    
    const entry = document.createElement('div');
    entry.className = `log-entry ${type}`;
    entry.innerHTML = content;
    terminalBody.appendChild(entry);
    terminalBody.scrollTop = terminalBody.scrollHeight;
}

function renderTagsHTML(tagsArray) {
    if (!tagsArray || !Array.isArray(tagsArray) || tagsArray.length === 0) return '';
    let chips = tagsArray.map(tag => {
        let cleanTag = tag.toLowerCase().trim().replace(/[\s-]+/g, '_');
        return `<span class="tag-chip tag-${cleanTag}">#${tag}</span>`;
    });
    return `<div class="tag-container">${chips.join('')}</div>`;
}

function updateStats() {
    const turnosEl = document.getElementById('stat-turnos');
    const afectoEl = document.getElementById('stat-afecto');
    const eventosEl = document.getElementById('stat-eventos');
    
    if (turnosEl) turnosEl.textContent = gameState.turns;
    
    let sum = 0;
    let count = 0;
    for (let k in npcsDB) {
        sum += npcsDB[k].affinity;
        count++;
    }
    let avg = count > 0 ? Math.min(100, Math.round(sum / count)) : 0;
    if (afectoEl) afectoEl.textContent = `${avg}%`;
    
    let eventCount = Object.keys(specialEvents).length;
    if (eventosEl) eventosEl.textContent = eventCount;
}

function checkSpecialEvent() {
    const room = roomsDB[gameState.currentRoom];
    if (room.isSpecialEvent && room.eventKey) {
        const event = specialEvents[room.eventKey];
        if (event && !gameState.eventActive) {
            // Check minimum affinity
            let canTrigger = true;
            if (event.minAffinity) {
                for (let p of event.participants) {
                    if (npcsDB[p] && npcsDB[p].affinity < event.minAffinity) {
                        canTrigger = false;
                        break;
                    }
                }
            }
            
            if (canTrigger) {
                gameState.eventActive = room.eventKey;
                gameState.eventStage = 0;
                triggerEvent(event);
            }
        }
    }
}

function triggerEvent(event) {
    sfx.playEvent();
    printLog(event.scenes.intro);
    
    if (event.scenes.options) {
        let optionsHTML = '<div class="dialogue-tree"><strong>¿Qué haces?</strong><br>';
        event.scenes.options.forEach((opt, idx) => {
            optionsHTML += `<div class="dialogue-option" onclick="selectEventOption('${event.eventKey}', ${idx})">${idx + 1}. ${opt.text}</div>`;
        });
        optionsHTML += '</div>';
        printLog(optionsHTML);
    }
}

function selectEventOption(eventKey, optionIdx) {
    const event = specialEvents[eventKey];
    const option = event.scenes.options[optionIdx];
    
    if (option.target && event.scenes.dialogues[option.target]) {
        const dialogue = event.scenes.dialogues[option.target];
        printLog(`<div class="speech-bubble"><strong>${option.text}:</strong><br>${dialogue.start}</div>`);
        
        let progressHTML = '<div class="nsfw-scene"><div class="nsfw-title">Desarrollo:</div>';
        dialogue.progress.forEach((line, idx) => {
            progressHTML += `<p>${idx + 1}. ${line}</p>`;
        });
        progressHTML += '</div>';
        
        setTimeout(() => {
            printLog(progressHTML);
            sfx.playNSFW();
            
            event.participants.forEach(p => {
                simsEngine.updateAffection(p, 50);
                simsEngine.updateArousal(p, 100);
            });
            updateStats();
        }, 1000);
    } else if (option.id === "observar") {
        printLog('<div class="speech-bubble">Decides observar desde las sombras, disfrutando del espectáculo sin intervenir. La escena es intensa y te deja excitado.</div>');
    } else if (option.target === "all") {
        printLog('<div class="nsfw-scene"><div class="nsfw-title">Participación Grupal</div><p>Te unes a la orgía completa, sintiendo el tacto de todos los demonios simultáneamente. Es una experiencia celestial... o infernal.</p></div>');

        event.participants.forEach(p => {

        updateStats();
    }
}

function handleSaveGame(slot = 'slot1') {
    const slotKey = `zork_save_${slot}`;
    const saveData = {
        gameState: gameState,
        npcsDB: npcsDB,
        timestamp: new Date().toLocaleString()
    };

    localStorage.setItem(slotKey, JSON.stringify(saveData));
    sfx.playCmdSuccess();
    printLog(`<div class="system-toast">💾 Partida guardada en [${slotKey.toUpperCase()}] (${saveData.timestamp}).</div>`);
}

function handleLoadGame(slot = 'slot1') {
    const slotKey = `zork_save_${slot}`;
    const raw = localStorage.getItem(slotKey);

    if (!raw) {
        printLog(`No existe ninguna partida guardada en el slot: "<strong>${slotKey}</strong>".`, 'warning');
        return;
    }

    try {
        const data = JSON.parse(raw);
        Object.assign(gameState, data.gameState);
        
        // Restore NPC data carefully
        if (data.npcsDB) {
            for (let key in data.npcsDB) {
                if (npcsDB[key]) {
                    npcsDB[key].affinity = data.npcsDB[key].affinity || npcsDB[key].affinity;
                    npcsDB[key].simsData = data.npcsDB[key].simsData || npcsDB[key].simsData;
                }
            }
        }

        updateStats();
        sfx.playAffectionUp();
        printLog(`<div class="system-toast">⚡ Partida cargada exitosamente desde [${slotKey.toUpperCase()}].</div>`);
        renderRoom();
        drawMapHUD();
    } catch (e) {
        printLog(`Error al cargar datos del slot ${slotKey}.`, 'warning');
    }
}

function findNPCInRoom(targetName) {
    if (!targetName) return null;
    const room = roomsDB[gameState.currentRoom];
    if (!room || !room.npcs) return null;
    
    return room.npcs.find(key => {
        const npc = npcsDB[key];
        return key.toLowerCase() === targetName.toLowerCase() || 
               (npc && npc.name.toLowerCase().includes(targetName.toLowerCase()));
    });
}

    `;
    printLog(html);
}

function escapeHTML(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function parseCommand(raw) {
    const input = raw.trim();
    if (!input) return;

    gameState.turns++;
    updateStats();
    
    // Add to history
    gameState.commandHistory.push(input);
    gameState.historyIndex = gameState.commandHistory.length;

    printLog(`<div class="cmd-echo"><span style="color:var(--green)">player@zork-palace</span>:<span style="color:var(--gold)">~/nexus</span>$ ${escapeHTML(input)}</div>`);

    const lower = input.toLowerCase();
    const tokens = lower.split(' ').filter(t => t !== '');
    const verb = tokens[0];

    // Handle NSFW commands with variants
    if (nsfwActions[verb]) {
        let target = tokens.slice(1).join(' ');
        let variant = 'give';
        
        // Check for explicit variant in command
        if (target.includes('recibir')) {
            variant = 'receive';
            target = target.replace(' recibir', '');
        } else if (target.includes('dar')) {
            variant = 'give';
            target = target.replace(' dar', '');
        }
        
        handleNSFWAction(target, verb, variant);
    } else if (['mindbreak', 'mindcontrol', 'sumiso'].includes(verb)) {
        let target = tokens.slice(1).join(' ');
        handleNSFWAction(target, verb, 'give');
    } else if (verb === "savegame") {
        handleSaveGame(tokens[1]);
    } else if (verb === "loadgame") {
        handleLoadGame(tokens[1]);
    } else if (["ir", "norte", "sur", "este", "oeste", "arriba", "abajo"].includes(verb)) {
        let dir = verb === "ir" ? tokens[1] : verb;
        handleMove(dir);
    } else if (["mirar", "look", "ver"].includes(verb)) {
        renderRoom();
    } else if (verb === "apariencia") {
        handleAppearance(tokens.slice(1).join(' '));
    } else if (verb === "sims" || verb === "enfocar") {
        let target = tokens.slice(1).join(' ');
        let foundKey = findNPCInRoom(target);
        if (foundKey) {
            printLog(simsEngine.renderSimsCard(foundKey));
        } else {
            printLog(`No encuentras a "<strong>${target}</strong>" cerca para ver sus métricas Sims.`, 'warning');
        }
    } else if (verb === "interacciones") {
        handleInteractionsList();
    } else if (verb === "interacciones_picantes") {
        handleListNSFW();
    } else if (verb === "eventos_especiales") {
        handleListEvents();
    } else if (["lugares_cita", "citas_lista"].includes(verb)) {
        handleListCitas();
    } else if (["cita", "invitar"].includes(verb)) {
        let target = tokens[1];
        let lugar = tokens[2];
        handleCita(target, lugar);
    } else if (verb === "regalar") {
        handleGive(lower);
    } else if (["cosas", "inventario", "inv"].includes(verb)) {
        handleInventory();
    } else if (verb === "desafiar") {
        handleDuel(tokens.slice(1).join(' '));
    } else if ([
        "hablar", "conversar", "besar", "coquetear", "seducir", "abrazar",
        "masaje", "masajear", "acariciar_cabello", "cabello", "acariciar", 
        "halagar", "elogiar", "poesia", "poema", "carta_amor", "carta", 
        "romantico", "bailar", "jugar", "juguetear", "tomar_mano", "mano"
    ].includes(verb)) {
        let target = tokens.slice(1).join(' ');
        let act = verb;

        if (verb === "conversar") act = "hablar";
        if (verb === "seducir") act = "coquetear";
        if (verb === "masajear") act = "masaje";
        if (verb === "cabello") act = "acariciar_cabello";
        if (verb === "elogiar") act = "halagar";
        if (verb === "poema") act = "poesia";
        if (verb === "carta") act = "carta_amor";
        if (verb === "mano") act = "tomar_mano";

        handleNPCAction(target, act);
    } else if (["tomar", "agarrar", "coger", "get"].includes(verb)) {
        handleTakeItem(tokens.slice(1).join(' '));
    } else if (["ayuda", "help"].includes(verb)) {
        handleHelp();
    } else if (["clear", "limpiar"].includes(verb)) {
        const terminalBody = document.getElementById('terminal-body');
        if (terminalBody) terminalBody.innerHTML = '';
    } else {
        printLog(`bash: comando no encontrado: "${verb}". Escribe <span class="highlight">ayuda</span> para la lista.`, 'warning');
    }

    drawMapHUD();
}

// ==================== INITIALIZATION ====================
function execQuick(cmd) {
    const cmdInput = document.getElementById('cmd-input');
    if (!cmdInput) return;
    
    cmdInput.value = cmd;
    parseCommand(cmd);
    cmdInput.value = '';
    cmdInput.focus();
}

function execQuickSims() {
    const room = roomsDB[gameState.currentRoom];
    if (room && room.npcs.length > 0) {
        let firstNpc = room.npcs[0];
        execQuick(`sims ${firstNpc}`);
    } else {
        printLog('No hay nadie en esta sala para ver sus métricas Sims.', 'warning');
    }
}

// Setup event listeners when DOM is ready
document.addEventListener('DOMContentLoaded', () => {
    const cmdInput = document.getElementById('cmd-input');
    const terminalBody = document.getElementById('terminal-body');
    
    if (!cmdInput || !terminalBody) {
        console.error("Required elements not found!");
        return;
    }
    
    cmdInput.addEventListener('keydown', function(e) {
        if (e.key === 'Tab') {
            e.preventDefault();
            handleTabAutocomplete(this);
        } else if (e.key === 'Enter') {
            const val = cmdInput.value;
            cmdInput.value = '';
            parseCommand(val);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (gameState.historyIndex > 0) {
                gameState.historyIndex--;
                cmdInput.value = gameState.commandHistory[gameState.historyIndex];
            }
        } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (gameState.historyIndex < gameState.commandHistory.length - 1) {
                gameState.historyIndex++;
                cmdInput.value = gameState.commandHistory[gameState.historyIndex];
            } else {
                gameState.historyIndex = gameState.commandHistory.length;
                cmdInput.value = '';
            }
        } else {
            sfx.playKeyPress();
        }
    });
    
    // Initial render
    printLog('<div class="event-banner"><div class="event-title">🌟 ZORK: PALACE OF DESIRES [+18] 🌟</div><p>Bienvenido al nexo multiversal donde todos tus deseos pueden hacerse realidad.</p><p><strong>✨ NUEVO:</strong> Sistema de NSFW mejorado con diálogos únicos por personaje y variantes dar/recibir.</p><p>Escribe <code>ayuda</code> para comenzar.</p></div>', 'room-title');
    renderRoom();
    drawMapHUD();
});
</script>
