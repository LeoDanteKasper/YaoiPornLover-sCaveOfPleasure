    <style>
        :root {
            --bg-color: #0c0d10;
            --term-bg: rgba(15, 17, 23, 0.96);
            --border-color: #2e3440;
            --text-main: #d8dee9;
            --text-muted: #616e88;
            --gold: #e5c07b;
            --cyan: #56b6c2;
            --green: #98c379;
            --red: #e06c75;
            --purple: #c678dd;
            --blue: #61afef;
            --orange: #d19a66;
            --font-stack: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Source Code Pro', 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(20, 24, 33, 0.8) 0%, rgba(10, 11, 14, 1) 100%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
            color: var(--text-main);
            font-family: var(--font-stack);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background-color 0.5s ease;
        }

        .terminal-window {
            width: 100%;
            max-width: 1200px;
            height: 95vh;
            background: var(--term-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(97, 175, 239, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(12px);
            transition: border-color 0.5s ease, background 0.5s ease;
        }

        .terminal-header {
            background: #1e222a;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #282c34;
            user-select: none;
        }

        .window-controls {
            display: flex;
            gap: 8px;
        }

        .control-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        .btn-close { background-color: #ff5f56; border: 1px solid #e0443e; }
        .btn-minimize { background-color: #ffbd2e; border: 1px solid #fea028; }
        .btn-maximize { background-color: #27c93f; border: 1px solid #1aab29; }

        .window-title {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .system-stats {
            display: flex;
            gap: 15px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .stat-badge {
            background: #21252b;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid #282c34;
        }

        .stat-badge span {
            color: var(--green);
            font-weight: bold;
        }

        .map-hud-container {
            background: #0f1117;
            border-bottom: 1px solid #282c34;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .map-hud-title {
            font-size: 0.8rem;
            color: var(--gold);
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .terminal-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scrollbar-width: thin;
            scrollbar-color: #3b4252 #0f1117;
        }

        .terminal-body::-webkit-scrollbar {
            width: 8px;
        }
        .terminal-body::-webkit-scrollbar-track {
            background: #0f1117;
        }
        .terminal-body::-webkit-scrollbar-thumb {
            background: #3b4252;
            border-radius: 4px;

        .log-entry {
            line-height: 1.6;
            font-size: 0.95rem;
            animation: fadeIn 0.15s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(2px); }
            to { opacity: 1; transform: translateY(0); }
        }

            color: var(--blue);
            font-weight: bold;

            align-items: center;

class ChiptuneAudioEngine {
    constructor() { 
        this.ctx = null; 
        this.enabled = true; 
    }
    
    init() { 
        if (!this.ctx) { 
            const AudioContext = window.AudioContext || window.webkitAudioContext; 
            this.ctx = new AudioContext(); 
        } 
    }
    
    playTone(freq, type = 'square', duration = 0.08, vol = 0.08) {
        if (!this.enabled) return;
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    }
    
    playKeyPress() { 
        this.playTone([380, 410, 440, 470][Math.floor(Math.random() * 4)], 'triangle', 0.02, 0.02); 
    }
    
    playCmdSuccess() { 
        this.playTone(523.25, 'square', 0.05, 0.04); 
        setTimeout(() => this.playTone(659.25, 'square', 0.06, 0.04), 50); 
    }
    
    playAffectionUp() {
        this.playTone(523.25, 'sine', 0.08, 0.06);
        setTimeout(() => this.playTone(659.25, 'sine', 0.08, 0.06), 70);
        setTimeout(() => this.playTone(783.99, 'sine', 0.08, 0.06), 140);
        setTimeout(() => this.playTone(1046.50, 'sine', 0.12, 0.08), 210);
    }
    
    playSpicy() {
        this.playTone(220, 'sine', 0.15, 0.1);
        setTimeout(() => this.playTone(261.63, 'sine', 0.2, 0.12), 100);
        setTimeout(() => this.playTone(329.63, 'triangle', 0.3, 0.08), 250);
    }
    
    playCombatHit() { 
        this.playTone(150, 'sawtooth', 0.1, 0.08); 
        setTimeout(() => this.playTone(80, 'sawtooth', 0.15, 0.1), 50); 
    }
    
    playNotification() {
        this.playTone(880, 'sine', 0.1, 0.05);
    }
}

// ==========================================
// CLASE PRINCIPAL DEL JUEGO
// ==========================================
class ZorkMultiverse {
    constructor() {
        this.currentRoom = "salon_central";
        this.inventory = [];
        this.gameLog = [];
        this.npcs = this.initializeNpcs();
        this.affection = {}; // { npcId: { current: 0, max: 100, unlocked: false } }
        this.knownInfo = {}; // { npcId: { likes: false, dislikes: false, hobbies: false, top: false } }
        this.currentNpc = null;
        this.npcAutonomyInterval = null;
        this.lastNpcAction = {};
        
        // Inicializar afecto e info
        Object.keys(this.npcs).forEach(id => {
            this.affection[id] = { current: 0, max: 100, unlocked: false };
            this.knownInfo[id] = { likes: false, dislikes: false, hobbies: false, top: false };
        });
        
        this.startNpcAutonomy();
    }

    initializeNpcs() {
        const npcs = {};
        Object.keys(rawNpcsDB).forEach(id => {
            npcs[id] = { ...rawNpcsDB[id], id: id };
        });
        return npcs;
    }

    startNpcAutonomy() {
        // Cada 30-60 segundos, un NPC puede interactuar contigo
        this.npcAutonomyInterval = setInterval(() => {
            this.npcRandomInteraction();
        }, 30000 + Math.random() * 30000);
    }

    npcRandomInteraction() {
        const currentRoomNpcs = Object.values(this.npcs).filter(n => n.room === this.currentRoom);
        if (currentRoomNpcs.length === 0) return;
        
        const npc = currentRoomNpcs[Math.floor(Math.random() * currentRoomNpcs.length)];
        const now = Date.now();
        
        // Evitar spam
        if (this.lastNpcAction[npc.id] && now - this.lastNpcAction[npc.id] < 120000) return;
        
        const actions = [
            { text: `${npc.name} te mira y sonríe.`, affection: 2 },
            { text: `${npc.name} se acerca a hablar contigo.`, affection: 3 },
            { text: `${npc.name} parece querer tu atención.`, affection: 2 },
            { text: `${npc.name} te hace un gesto amistoso.`, affection: 3 },
            { text: `${npc.name} se queda mirándote con interés.`, affection: 4 }
        ];
        
        const action = actions[Math.floor(Math.random() * actions.length)];
        this.addToLog("📢 " + action.text, "npc");
        this.modifyAffection(npc.id, action.affection);
        this.lastNpcAction[npc.id] = now;
        
        sfx.playNotification();
        this.updateUI();
    }

    getRoom(id) {
        return rooms[id] || rooms.salon_central;
    }

    getCurrentRoom() {
        return this.getRoom(this.currentRoom);
    }

    move(direction) {
        const room = this.getCurrentRoom();
        const nextRoom = room.exits[direction];
        
        if (nextRoom) {
            this.currentRoom = nextRoom;
            const newRoom = this.getCurrentRoom();
            sfx.playCmdSuccess();
            this.addToLog(`\n🏃 Te mueves a: ${newRoom.name}`, "system");
            this.addToLog(newRoom.desc, "desc");
            this.addToLog(`\n${newRoom.logo}`, "logo");
            this.describeRoom();
            this.updateUI();
            return true;
        } else {
            sfx.playCombatHit();
            this.addToLog("❌ No puedes ir en esa dirección.", "error");
            return false;
        }
    }

    describeRoom() {
        const room = this.getCurrentRoom();
        let desc = `\n╔══════════════════════════════════════╗\n`;
        desc += `║  ${room.name.padEnd(36)} ║\n`;
        desc += `╚══════════════════════════════════════╝\n`;
        desc += `${room.desc}\n\n`;
        
        // Salidas
        const exits = Object.keys(room.exits);
        if (exits.length > 0) {
            desc += `🚪 Salidas: ${exits.join(", ")}\n`;
        }
        
        // NPCs en la sala
        const npcsHere = Object.values(this.npcs).filter(n => n.room === this.currentRoom);
        if (npcsHere.length > 0) {
            desc += `\n👥 Personajes aquí:\n`;
            npcsHere.forEach(npc => {
                const aff = this.affection[npc.id].current;
                const heart = aff > 75 ? "💖" : aff > 50 ? "💕" : aff > 25 ? "💗" : "🤍";
                desc += `  ${heart} ${npc.name} - ${npc.desc.substring(0, 50)}...\n`;
            });
        }
        
        this.addToLog(desc, "room");
    }

    look() {
        this.describeRoom();
    }

    lookNpc(npcId) {
        const npc = this.npcs[npcId];
        if (!npc) return false;
        
        if (npc.room !== this.currentRoom) {
            this.addToLog(`❌ ${npc.name} no está aquí.`, "error");
            return false;
        }

        let desc = `\n╔══════════════════════════════════════╗\n`;
        desc += `║  ${npc.name.padEnd(36)} ║\n`;
        desc += `╚══════════════════════════════════════╝\n`;
        desc += `${npc.desc}\n\n`;
        
        // Expresión ASCII según afecto
        const aff = this.affection[npc.id].current;
        let expression = "neutro";
        if (aff >= 80) expression = "enamorado";
        else if (aff >= 60) expression = "feliz";
        else if (aff >= 40) expression = "sonrojado";
        else if (aff >= 20) expression = "neutro";
        else expression = "serio";
        
        const exp = asciiExpressions[expression];
        desc += `┌─────────────────────────────────────┐\n`;
        desc += `│  ${npc.asciiFace}  │\n`;
        desc += `│  Estado: ${expression.padEnd(20)} │\n`;
        desc += `└─────────────────────────────────────┘\n`;
        
        // Info desbloqueable
        const info = this.knownInfo[npc.id];
        const unlocked = aff >= 25;
        
        desc += `\n📊 Afecto: ${aff}/100 ${"█".repeat(Math.floor(aff/5))}${"░".repeat(20-Math.floor(aff/5))}\n`;
        
        if (unlocked) {
            desc += `\n🔓 Información desbloqueada:\n`;
            if (info.likes) desc += `  ❤️ Gustos: ${npc.likes.join(", ")}\n`;
            else desc += `  ❤️ Gustos: [Habla más para descubrir]\n`;
            
            if (info.dislikes) desc += `  💔 Disgustos: ${npc.dislikes.join(", ")}\n`;
            else desc += `  💔 Disgustos: [Habla más para descubrir]\n`;
            
            if (info.hobbies) desc += `  🎯 Hobbies: ${npc.hobbies.join(", ")}\n`;
            else desc += `  🎯 Hobbies: [Habla más para descubrir]\n`;
            
            if (info.top) desc += `  ⭐ Interacciones favoritas: ${npc.topInteractions.join(", ")}\n`;
            else desc += `  ⭐ Interacciones favoritas: [Habla más para descubrir]\n`;
        } else {
            desc += `\n🔒 Habla más con ${npc.name} para desbloquear información secreta (${Math.floor(aff)}/25)\n`;
        }
        
        desc += `\n🏷️ Tags: ${npc.tags.join(", ")}\n`;
        desc += `🌟 Interacción especial: ${npc.specialInteraction}\n`;
        
        this.addToLog(desc, "npc");
        this.currentNpc = npcId;
        return true;
    }

    interact(npcId, action) {
        const npc = this.npcs[npcId];
        if (!npc || npc.room !== this.currentRoom) {
            this.addToLog("❌ Ese personaje no está aquí.", "error");
            return false;
        }

        const interaction = socialInteractions[action];
        if (!interaction) {
            this.addToLog(`❌ Interacción '${action}' no disponible.`, "error");
            return false;
        }

        // Verificar si es picante y si está desbloqueado
        if (interaction.spicy && this.affection[npcId].current < 50) {
            this.addToLog(`🔒 ${npc.name} no está listo para interacciones íntimas. Necesitas más afecto (50/100).`, "error");
            return false;
        }

        // Calcular puntos
        let points = interaction.basePoints;
        const isFavorite = npc.topInteractions.includes(action);
        const isTagMatch = npc.tags.some(tag => action.includes(tag));
        
        if (isFavorite) {
            points *= 2;
            this.addToLog(`⭐ ¡${action} es una de sus interacciones favoritas!`, "bonus");
        }
        if (isTagMatch) points *= 1.5;

        // Respuesta aleatoria
        const response = interaction.responses[Math.floor(Math.random() * interaction.responses.length)];
        
        this.addToLog(`\n💬 Usas '${action}' con ${npc.name}:`, "action");
        this.addToLog(`   ${interaction.desc}`, "desc");
        this.addToLog(`   ${npc.name} ${response}`, "response");
        this.addToLog(`   +${Math.floor(points)} puntos de afecto`, "points");

        // Sonido
        if (interaction.spicy) {
            sfx.playSpicy();
        } else if (points > 15) {
            sfx.playAffectionUp();
        } else {
            sfx.playCmdSuccess();
        }

        // Modificar afecto
        this.modifyAffection(npcId, points);
        
        // Desbloquear info progresivamente
        this.unlockInfo(npcId, points);
        
        this.updateUI();
        return true;
    }

    unlockInfo(npcId, points) {
        const aff = this.affection[npcId].current;
        const info = this.knownInfo[npcId];
        
        // Desbloquear likes al 25%
        if (aff >= 25 && !info.likes) {
            info.likes = true;
            this.addToLog(`🔓 ¡Descubriste los gustos de ${this.npcs[npcId].name}!`, "unlock");
        }
        // Desbloquear dislikes al 40%
        if (aff >= 40 && !info.dislikes) {
            info.dislikes = true;
            this.addToLog(`🔓 ¡Descubriste los disgustos de ${this.npcs[npcId].name}!`, "unlock");
        }
        // Desbloquear hobbies al 60%
        if (aff >= 60 && !info.hobbies) {
            info.hobbies = true;
            this.addToLog(`🔓 ¡Descubriste los hobbies de ${this.npcs[npcId].name}!`, "unlock");
        }
        // Desbloquear top interactions al 80%
        if (aff >= 80 && !info.top) {
            info.top = true;
            this.addToLog(`🔓 ¡Descubriste las interacciones favoritas de ${this.npcs[npcId].name}!`, "unlock");
        }
    }

    modifyAffection(npcId, amount) {
        const aff = this.affection[npcId];
        aff.current = Math.min(aff.max, Math.max(0, aff.current + amount));
        
        if (aff.current >= 100 && !aff.unlocked) {
            aff.unlocked = true;
            this.addToLog(`🎉 ¡${this.npcs[npcId].name} ha alcanzado el máximo afecto contigo!`, "achievement");
            sfx.playAffectionUp();
        }
    }

    giveItem(npcId, itemId) {
        const npc = this.npcs[npcId];
        const item = itemsDB[itemId];
        
        if (!npc || !item) {
            this.addToLog("❌ No puedes hacer eso.", "error");
            return false;
        }

        if (npc.room !== this.currentRoom) {
            this.addToLog(`❌ ${npc.name} no está aquí.`, "error");
            return false;
        }

        const bonus = item.giveEffect[npcId] || 10;
        this.modifyAffection(npcId, bonus);
        
        this.addToLog(`🎁 Le das ${item.name} a ${npc.name}.`, "item");
        this.addToLog(`   "${item.desc}"`, "desc");
        this.addToLog(`   ¡Le encanta! +${bonus} afecto`, "points");
        
        sfx.playAffectionUp();
        this.updateUI();
        return true;
    }

    showInventory() {
        if (this.inventory.length === 0) {
            this.addToLog("🎒 Tu inventario está vacío.", "system");
            return;
        }
        
        let text = "\n🎒 Inventario:\n";
        this.inventory.forEach(item => {
            text += `  • ${itemsDB[item]?.name || item}\n`;
        });
        this.addToLog(text, "inventory");
    }

    showHelp() {
        const help = `
╔══════════════════════════════════════════════════════════════╗
║                    COMANDOS DISPONIBLES                      ║
╠══════════════════════════════════════════════════════════════╣
║  MOVIMIENTO: norte, sur, este, oeste, arriba, abajo          ║
║  EXAMINAR: mirar, mirar [personaje], inventario              ║
║  SOCIALES: hablar, conversar, coquetear, halagar, abrazar    ║
║            masaje, carta, poesia, bailar, jugar              ║
║            acariciar, contentar, cosquillas, acurrucar       ║
║            morder_suave, morder_fuerte                      ║
║  ESPECIALES: desafiar, entrenamiento_espartano, jutsu_secreto║
║              pacto_demoniaco, furia_berserker              ║
║  PICANTES: sexo, 69, footjob, anilingus, masturbar          ║
║            dedear, bombear_pechos, ordeñar, striptease       ║
║            nalgear, beso, seducir, romantico                 ║
║  REGALAR: dar [objeto] a [personaje]                         ║
║  SISTEMA: ayuda, mapa, limpiar, guardar, cargar             ║
╚══════════════════════════════════════════════════════════════╝
        `;
        this.addToLog(help, "help");
    }

    showMap() {
        const room = this.getCurrentRoom();
        let map = `\n╔══════════════════════════════════════╗\n`;
        map += `║           MINIMAPA                   ║\n`;
        map += `╚══════════════════════════════════════╝\n\n`;
        
        map += `📍 Estás en: ${room.name}\n`;
        map += `🏷️ Universo: ${room.universe.toUpperCase()}\n\n`;
        
        // Mostrar conexiones
        map += `🧭 Conexiones desde aquí:\n`;
        Object.entries(room.exits).forEach(([dir, dest]) => {
            const destRoom = rooms[dest];
            map += `  ${dir.toUpperCase().padEnd(8)} → ${destRoom.name} ${destRoom.universe !== room.universe ? `[${destRoom.universe}]` : ''}\n`;
        });
        
        // Mostrar personajes cercanos
        const nearby = Object.values(this.npcs).filter(n => {
            const nRoom = rooms[n.room];
            return nRoom && nRoom.universe === room.universe;
        });
        
        if (nearby.length > 0) {
            map += `\n👥 Personajes en este universo:\n`;
            nearby.forEach(n => {
                const here = n.room === this.currentRoom ? " [AQUÍ]" : "";
                map += `  • ${n.name}${here}\n`;
            });
        }
        
        this.addToLog(map, "map");
    }

    addToLog(text, type = "normal") {
        const entry = { text, type, time: new Date().toLocaleTimeString() };
        this.gameLog.push(entry);
        
        // Limitar log
        if (this.gameLog.length > 100) {
            this.gameLog.shift();
        }
        
        this.updateUI();
    }

    updateUI() {
        // Esta función será sobrescrita por el HTML para actualizar la interfaz
        if (window.updateGameUI) {
            window.updateGameUI(this);
        }
    }

    getNpcStatus(npcId) {
        const npc = this.npcs[npcId];
        const aff = this.affection[npcId];
        const info = this.knownInfo[npcId];
        
        // Determinar expresión
        let expression = "neutro";
        if (aff.current >= 80) expression = "enamorado";
        else if (aff.current >= 60) expression = "feliz";
        else if (aff.current >= 40) expression = "sonrojado";
        else if (aff.current >= 20) expression = "neutro";
        else expression = "serio";
        
        const exp = asciiExpressions[expression];
        
        return {
            npc,
            affection: aff,
            info,
            expression,
            ascii: `(${exp.eyes})`,
            color: exp.color,
            unlocked: aff.current >= 25
        };
    }
}

window.ZorkMultiverse = ZorkMultiverse;
window.rooms = rooms;
window.itemsDB = itemsDB;
window.socialInteractions = socialInteractions;
window.asciiExpressions = asciiExpressions;
window.universeLogos = universeLogos;
window.rawNpcsDB = rawNpcsDB;

// Inicialización cuando el DOM está listo
document.addEventListener('DOMContentLoaded', () => {
    window.game = new ZorkMultiverse();
    window.game.describeRoom();
});
